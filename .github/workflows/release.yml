# Builds OB-Xd for MPC in GitHub Actions and attaches OB-Xd-<version>-mpc-armv7.zip to a DRAFT release. The zip ships only
# the cleared banks committed in banks/ (Moby Pixel and the nine other banks; .gitignore keeps anything else out of the repo).
# Actions -> Release -> Run workflow, enter the version. Install that zip on an MPC, check it, then publish the draft.
# Release notes: write docs/releases/v<version>.md first -- what changed and what was fixed since the last release (not
# install steps; those are in INSTALL.md inside the zip). The draft's notes are that file.
# mpc-vst-plugins is pinned in both places below: the workflow and its tools (2ce3805: 8dd4c2f + notes from docs/releases + armv7 C++ built with GCC 10 for MPC OS 2.x's libstdc++).
# No host_test: the toolchain's generic bank-stepping checks expect a full range of banks, and this engine clamps the bank
# to the ones it finds (4 in a release), so they fail by design (they did before the 2026-10-21 toolchain too).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.4.4
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and page previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: 3dthc/mpc-vst-plugins/.github/workflows/vst-release.yml@81ad64dd54a7d1e66ec0dc9b0b2fca050ac53a47
    permissions: { contents: write }
    secrets: inherit   # optional Apple signing/notarization (mpc-vst-plugins docs/DESKTOP_VST3.md)
    with:
      tag: ob-xd-mpc-${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 81ad64dd54a7d1e66ec0dc9b0b2fca050ac53a47
      vst_dir: vst
      build: '"$MPC_VST/tools/build_port.sh" vst/vst.json'
      extra: banks:banks
      user_data: my-banks
      about: OB-Xd virtual analog polysynth (unofficial port).
      plugin_id: obxdmpc
      license: GPL-3.0-only
      dry_run: ${{ inputs.dry_run }}
      desktop: true
      desktop_data: banks
